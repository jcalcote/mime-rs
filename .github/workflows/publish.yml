name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      EXPECTED_CRATE: mime-inspect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Require publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Configure the CRATES_IO_TOKEN repository secret before publishing."
            exit 1
          fi
      - name: Check crate identity and release version
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          if package["name"] != os.environ["EXPECTED_CRATE"]:
              raise SystemExit("Unexpected crate identity")
          if os.environ["RELEASE_TAG"] != "v" + package["version"]:
              raise SystemExit("Release tag does not match package version")
          print("Publishing", package["name"], package["version"])
          PYCODE
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --all-targets --all-features
      - run: cargo +stable test --locked --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps
      - name: Verify package
        run: cargo +stable package --locked
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo +stable publish --locked
